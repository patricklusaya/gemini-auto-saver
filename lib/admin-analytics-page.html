<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analytics — Gemini Auto Image Saver</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/assets/icon128.png" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="/">
        <img src="/assets/icon128.png" width="28" height="28" alt="" />
        Gemini Auto Image Saver
      </a>
    </div>
  </header>

  <main id="main" class="admin-main">
    <p class="admin-kicker">Gemini Auto Image Saver</p>
    <h1>Analytics</h1>
    <p class="admin-lead">Click counts from tracking links. No prompt or customer data.</p>

    <div class="admin-toolbar">
      <label>
        Range
        <select id="range">
          <option value="all" selected>All time</option>
          <option value="7d">Last 7 days</option>
          <option value="30d">Last 30 days</option>
        </select>
      </label>
      <div class="admin-actions">
        <button id="refresh" class="btn" type="button">Refresh</button>
        <form method="post" action="/api/admin/logout">
          <button class="btn ghost" type="submit">Logout</button>
        </form>
      </div>
    </div>

    <p id="status" class="admin-status">Loading…</p>
    <section id="cards" class="admin-cards" hidden></section>

    <h2>Traffic sources</h2>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Source</th>
            <th>Campaign</th>
            <th>Clicks</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="3" class="admin-empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
    <p id="updated" class="admin-updated"></p>
  </main>
  <script src="/js/admin-analytics.js"></script>
</body>
</html>
